apply plugin: 'com.android.application'

android {
    namespace 'com.solico.tmr.offline'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solico.tmr.offline'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(project.findProperty('versionCode') ?: '1')
        versionName project.findProperty('versionName') ?: '1'
        resValue 'string', 'app_name', project.findProperty('appName') ?: 'TMR Offline'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('OFFLINE_KEYSTORE'))
            storePassword System.getenv('BUBBLEWRAP_KEYSTORE_PASSWORD')
            keyAlias 'android'
            keyPassword System.getenv('BUBBLEWRAP_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
